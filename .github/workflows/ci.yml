name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: pnpm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  docker:
    name: docker build + health smoke
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: breezevibe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Same gate the VPS applies before nginx flips off the placeholder.
      - name: GET /api/health must return 200
        run: |
          docker run -d --name bv -p 3060:3000 breezevibe:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3060/api/health; then exit 0; fi
            sleep 2
          done
          echo "::error::/api/health never returned 200"
          docker logs bv
          exit 1

  notify-vps:
    name: notify VPS-01 (webhook-pull)
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
    steps:
      - name: POST breezevibe-deploy webhook
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          DELIVERY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "::warning::DEPLOY_WEBHOOK_URL / DEPLOY_WEBHOOK_SECRET not set; skipping VPS-01 notify. Add them under repo Settings > Secrets once VPS-01 registers the breezevibe-deploy hook."
            exit 0
          fi
          # GitHub push-shaped payload; deploy.sh reads .after for the SHA to check out.
          payload=$(jq -cn --arg ref "refs/heads/main" --arg after "$SHA" --arg before "$BEFORE" --arg repo "$REPO" \
            '{ref:$ref, after:$after, before:$before, repository:{full_name:$repo}, head_commit:{id:$after}}')
          sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-GitHub-Delivery: $DELIVERY" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data "$payload")
          echo "webhook responded $code"; cat /tmp/resp.txt || true
          case "$code" in 2*) exit 0;; *) echo "::error::webhook returned $code"; exit 1;; esac
